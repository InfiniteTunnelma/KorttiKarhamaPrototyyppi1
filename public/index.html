<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korttikärhämä</title>
<style>
:root{--bg:#151812;--panel:#22271c;--line:#555b42;--paper:#eee5cf;--muted:#b8b39e;--gold:#d3a34c;--red:#a9442f;--ink:#241f16}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#20251a,#10130e);color:var(--paper);font-family:system-ui,Arial,sans-serif;padding:16px}
.wrap{max-width:1050px;margin:auto}
.mast,.panel{border:1px solid var(--line);background:var(--panel);box-shadow:0 5px 20px #0005}
.mast{padding:20px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold)}
h1{font-size:clamp(35px,8vw,64px);margin:4px 0;letter-spacing:3px}
h2{margin-top:0}
.sub,.hint{color:var(--muted)}
.panel{padding:16px;margin-bottom:14px}
.status{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);padding:6px 9px;color:var(--muted);font-size:12px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
button,input{font:inherit}
button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:11px 14px;border-radius:3px;cursor:pointer}
button.primary{background:var(--gold);color:var(--ink);font-weight:800}
button:disabled{opacity:.35;cursor:not-allowed}
input{background:#10130e;border:1px solid var(--line);color:var(--paper);padding:11px;text-transform:uppercase;width:150px}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.card{width:58px;height:82px;background:var(--paper);color:var(--ink);border-radius:5px;padding:5px;display:flex;flex-direction:column;justify-content:space-between;font-weight:800;box-shadow:0 2px 6px #0008}
.card.red{color:var(--red)}
.card.joker{background:#d7c493;color:#704026}
.mid{text-align:center;font-size:20px}
.bottom{align-self:end;transform:rotate(180deg)}
.selectable{cursor:pointer}
.selected{outline:3px solid var(--gold);transform:translateY(-5px)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{border:1px solid var(--line);background:#11140f;min-height:125px;padding:9px;cursor:pointer}
.slot:hover,.slot.selected{border-color:var(--gold)}
.slot h3{font-size:11px;color:var(--gold);margin:0 0 7px}
.cards{display:flex;flex-wrap:wrap;gap:4px}
.mini{width:38px;height:54px;font-size:10px;padding:3px}
.mini .mid{font-size:14px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:1px solid var(--line);background:#11140f;padding:12px}
.choice h3{color:var(--gold);margin:0 0 8px}
.platoon-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.platoon-buttons button{min-height:60px}
.platoon-buttons button.selected{background:var(--gold);color:var(--ink)}
.battle{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.side{border:1px solid var(--line);padding:12px;min-height:190px}
.vs{font-size:24px;color:var(--red);font-weight:900}
.big{font-size:30px;color:var(--gold);font-weight:900;margin-top:8px}
.notice{padding:11px;border-left:3px solid var(--gold);background:#171b13;margin:10px 0}
.error{color:#ff9278}
.center{text-align:center}
@media(max-width:700px){
.slots{grid-template-columns:1fr}
.choice-grid,.battle{grid-template-columns:1fr}
.vs{text-align:center}
.platoon-buttons{grid-template-columns:repeat(5,1fr)}
.card{width:52px;height:74px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="mast">
<div class="eyebrow">ONLINE · 2 PELAAJAA</div>
<h1>KORTTIKÄRHÄMÄ</h1>
<div class="sub">
Viisi osastoa. Vuorossa oleva pelaaja päättää, mitkä kaksi osastoa kohtaavat.
</div>
</div>

<div id="app"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket=io();

let state=null;
let selectedHand=null;
let ownPick=null;
let enemyPick=null;

const app=document.getElementById('app');

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function card(c,cls=''){
if(c.hidden)
return '<div class="card mini">?</div>';

const j=c.joker||c.rank==='JOKER';

return `
<div class="card ${c.color==='red'?'red':''} ${j?'joker':''} ${cls}">
<div>${j?'★':c.rank}</div>
<div class="mid">${j?'JOKER':c.suit}</div>
<div class="bottom">${j?'★':c.rank}</div>
</div>`;
}

function home(){

app.innerHTML=`
<div class="panel">
<h2>ALOITA ONLINE-PELI</h2>

<div class="row">

<button class="primary" id="create">
LUO HUONE
</button>

<input id="joinCode"
maxlength="5"
placeholder="HUONEKOODI">

<button id="join">
LIITY
</button>

</div>

<p class="hint">
Luo huone ja lähetä viiden merkin koodi ystävällesi.
</p>

</div>
`;

document.getElementById('create').onclick=()=>{
socket.emit('createRoom');
};

document.getElementById('join').onclick=()=>{
socket.emit(
'joinRoom',
document.getElementById('joinCode').value
);
};
}

function render(){

if(!state){
home();
return;
}

const s=state;

let b=`
<div class="status">

<span class="pill">
HUONE <b>${esc(s.code)}</b>
</span>

<span class="pill">
SINÄ: PELAAJA ${s.playerNumber}
</span>

<span class="pill">
P1 ${s.players[0]?.connected?'●':'○'}
</span>

<span class="pill">
P2 ${s.players[1]?.connected?'●':'○'}
</span>

</div>
`;

if(s.phase==='waiting'||s.phase==='ready'){

b+=`
<div class="panel center">

<h2>ODOTETAAN PELAAJAA</h2>

<p>Huonekoodi</p>

<h1 style="color:var(--gold)">
${esc(s.code)}
</h1>

<p>
${s.players.length<2
?'Lähetä koodi ystävällesi.'
:'Molemmat pelaajat ovat paikalla.'}
</p>

<button
class="primary"
id="start"
${s.players.length<2?'disabled':''}>
ALOITA PELI
</button>

</div>
`;

}

else if(s.phase==='arrange'){

const own=s.platoons[s.playerNumber-1];

b+=`

<div class="panel">

<h2>JÄRJESTÄ OSASTOSI</h2>

<p>
Valitse kortti ja sijoita se yhteen viidestä osastosta.
Kortteja jäljellä: <b>${s.hand.length}</b>
</p>

<div class="hand">

${s.hand.map((c,i)=>`

<div
class="selectable"
onclick="pickHand(${i})">

${card(
c,
selectedHand===i?'selected':''
)}

</div>

`).join('')}

</div>

</div>

<div class="panel">

<h2>OMAT OSASTOT</h2>

<div class="slots">

${own.map((cards,i)=>`

<div
class="slot"
onclick="place(${i})">

<h3>
OSASTO ${i+1} · ${cards.length} KORTTIA
</h3>

<div class="cards">

${cards.map(c=>card(c,'mini')).join('')
||'<span>— tyhjä —</span>'}

</div>

</div>

`).join('')}

</div>

${s.hand.length===0
?`
<div class="notice">
Kun olet valmis, paina VALMIS.
Taistelu alkaa, kun molemmat ovat valmiita.
</div>

<button class="primary" id="ready">
VALMIS
</button>
`
:''}

</div>
`;

}

else if(s.phase==='battle'){

const turn=s.battle.turn;

const can=
s.playerNumber===turn &&
!s.battle.revealed;

const p1=s.platoons[0];
const p2=s.platoons[1];

const sel=s.battle.selection;

const last=s.battle.last;

let myOwn=
s.playerNumber===1
?ownPick
:enemyPick;

let myEnemy=
s.playerNumber===1
?enemyPick
:ownPick;

b+=`

<div class="panel">

<h2>
TAISTELU ${s.battle.results.length+1} / 5
</h2>

<div class="notice">

${
s.battle.revealed

?`Taistelu ratkaistu. Seuraavaksi vuoro vaihtuu.`

:`Vuorossa on <b>PELAAJA ${turn}</b>.
Tämä pelaaja valitsee yhden oman ja yhden vastustajan osaston.`
}

</div>
`;

if(!s.battle.revealed&&can){

b+=`

<div class="choice-grid">

<div class="choice">

<h3>
VALITSE OMA OSASTO
</h3>

<div class="platoon-buttons">

${p1.map((x,i)=>`

<button
class="${
(s.playerNumber===1?ownPick:enemyPick)===i
?'selected':''
}"
onclick="pickOwn(${i})">

${i+1}<br>
${x.length} korttia

</button>

`).join('')}

</div>

</div>


<div class="choice">

<h3>
VALITSE VASTUSTAJAN OSASTO
</h3>

<div class="platoon-buttons">

${p2.map((x,i)=>`

<button
class="${
(s.playerNumber===1?enemyPick:ownPick)===i
?'selected':''
}"
onclick="pickEnemy(${i})">

${i+1}<br>
${x.length} korttia

</button>

`).join('')}

</div>

</div>

</div>

<div
class="center"
style="margin-top:14px">

<button
class="primary"
id="fight"
${myOwn===null||myEnemy===null?'disabled':''}>

TAISTELE

</button>

</div>

`;

}

else if(!s.battle.revealed){

b+=`
<p class="hint">
Odota, että Pelaaja ${turn} valitsee taistelun.
</p>
`;

}

const show1=
sel
?p1[sel.p1]
:[];

const show2=
sel
?p2[sel.p2]
:[];

b+=`

<div
class="battle"
style="margin-top:16px">

<div class="side">

<b>
PELAAJA 1 · OSASTO
${sel?sel.p1+1:'?'}
</b>

<div
class="cards"
style="margin-top:8px">

${show1.map(c=>
s.battle.revealed
?card(c,'mini')
:card({hidden:true},'mini')
).join('')
||'—'}

</div>

<div class="big">

${
s.battle.revealed&&last
?last.p1Points
:'?'
}

</div>

</div>

<div class="vs">
VS
</div>

<div class="side">

<b>
PELAAJA 2 · OSASTO
${sel?sel.p2+1:'?'}
</b>

<div
class="cards"
style="margin-top:8px">

${show2.map(c=>
s.battle.revealed
?card(c,'mini')
:card({hidden:true},'mini')
).join('')
||'—'}

</div>

<div class="big">

${
s.battle.revealed&&last
?last.p2Points
:'?'
}

</div>

</div>

</div>
`;

if(s.battle.revealed&&last){

let r=
s.battle.results[
s.battle.results.length-1
];

b+=`

<div class="notice">

${
s.battle.jokerSwap
?'★ JOKERI VAIHTOI VALITTUJEN OSASTOJEN PUOLET. '
:''
}

${
r.winner===0
?'TASAPELI'
:`PELAAJA ${r.winner} VOITTAA OSASTON!`
}

</div>

<button
class="primary"
id="next">

${
s.battle.results.length>=5
?'KATSO LOPPUTULOS'
:'SEURAAVA VUORO'
}

</button>

`;

}

b+=`

</div>

<div class="panel">

TULOS:
<b>
${s.battle.score[0]} — ${s.battle.score[1]}
</b>

</div>

`;

}

else if(s.phase==='finished'){

b+=`

<div class="panel center">

<h2>

${
s.winner===0
?'TASAPELI'
:`PELAAJA ${s.winner} VOITTAA!`
}

</h2>

<div class="big">

${s.battle.score[0]}
—
${s.battle.score[1]}

</div>

<p>
Kaikki viisi taistelua on ratkaistu.
</p>

</div>

`;

}

app.innerHTML=b;

bind(s);
}

function bind(s){

const a=id=>
document.getElementById(id);

if(a('start'))
a('start').onclick=()=>{
socket.emit('startGame');
};

if(a('ready'))
a('ready').onclick=()=>{
socket.emit('ready');
};

if(a('fight'))

a('fight').onclick=()=>{

const own=
s.playerNumber===1
?ownPick
:enemyPick;

const enemy=
s.playerNumber===1
?enemyPick
:ownPick;

socket.emit(
'chooseBattle',
{
own,
enemy
}
);

setTimeout(()=>{
socket.emit('revealBattle');
},100);

};

if(a('next'))

a('next').onclick=()=>{
socket.emit('nextTurn');
};

}

function pickHand(i){

selectedHand=
selectedHand===i
?null
:i;

render();
}

function place(i){

if(selectedHand===null)
return;

socket.emit(
'placeCard',
{
handIndex:selectedHand,
platoon:i
}
);

selectedHand=null;
}

function pickOwn(i){

ownPick=i;
render();
}

function pickEnemy(i){

enemyPick=i;
render();
}

socket.on('state',s=>{

state=s;

if(s.phase!=='battle'){
ownPick=null;
enemyPick=null;
}

render();

});

socket.on('errorMessage',m=>{

state=null;

app.innerHTML=`

<div class="panel">

<p class="error">
${esc(m)}
</p>

<button onclick="home()">
TAKAISIN
</button>

</div>

`;

});

socket.on('connect',()=>{

if(!state)
home();

});
</script>

</body>
</html>
